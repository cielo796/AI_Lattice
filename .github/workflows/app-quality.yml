name: App Quality

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-quality.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "app/**"
      - ".github/workflows/app-quality.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run check:mojibake
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit --pretty false

  onboarding:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        spec: [workspace-onboarding.spec.ts, setup-concurrency.spec.ts]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lattice_onboarding
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lattice_onboarding"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lattice_onboarding?schema=public
      DEMO_AUTO_SEED: "false"
      SETUP_TOKEN: "ci-only-onboarding-token-not-for-deployment"
      PLAYWRIGHT_SETUP_TEST: "true"
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- ${{ matrix.spec }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: onboarding-${{ matrix.spec }}
          path: app/test-results/

  workflow-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lattice_workflow_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lattice_workflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lattice_workflow_test?schema=public
      TEST_WORKFLOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lattice_workflow_test?schema=public
      DEMO_AUTO_SEED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npx vitest run src/server/workflows/graph.integration.test.ts

  runtime-performance:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lattice_test_performance
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lattice_test_performance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lattice_test_performance?schema=public
      DEMO_AUTO_SEED: "true"
      OPENAI_API_KEY: ""
      PLAYWRIGHT_PERFORMANCE_TEST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- runtime-performance.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: runtime-performance-results
          path: app/test-results/

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stitch
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stitch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: app
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/stitch?schema=public
      DEMO_AUTO_SEED: "true"
      OPENAI_API_KEY: ""
      CRON_SECRET: "ci-only-workflow-cron-token-32-characters"
      PLAYWRIGHT_WORKFLOW_RECOVERY_TEST: "true"
      PLAYWRIGHT_WORKFLOW_SCHEDULE_TEST: "true"
      WORKFLOW_API_ALLOWED_ORIGINS: "https://workflow-test.invalid"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run db:health -- --schema-only
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run db:health
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            app/test-results/
            app/playwright-report/
